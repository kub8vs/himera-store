<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himera — sklep</title>
<meta name="description" content="Sklep Himery: flagi, kominiarki i naklejki. Darmowa dostawa od 70 zł.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.head.shop{display:grid;grid-template-columns:1fr auto 1fr}
.head.shop .logo-s img{display:block;width:52px}
.head.shop .right{justify-self:end;display:flex;gap:22px;align-items:center}
.head.shop .links a[aria-current]{color:#ff4a3d}
.pb{position:relative;height:calc(100svh - 112px);min-height:660px;max-height:980px;overflow:hidden;background:#070505}
.pb-bg{position:absolute;inset:0;transition:opacity .6s ease}
.pb-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.pb-flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.is-g .pb-flash{animation:pbFlash .55s ease-out}
.pb-stage{position:absolute;right:0;top:0;bottom:0;width:58%}
.pb-char{position:absolute;inset:0;opacity:0;transform:translateX(6%);transition:opacity .35s ease,transform .6s cubic-bezier(.2,.7,.1,1)}
.pb-char.on{opacity:1;transform:none}
.is-g .pb-char.on{animation:pbCharIn .55s steps(1,end) both}
.pb-char img{position:absolute;max-width:none;filter:grayscale(1) contrast(1.08)}
.pb-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45}
.pb-orb{position:absolute;width:44px;opacity:.85;animation:pbFloat 6s ease-in-out infinite}
.pb-orb-1{right:10%;top:18%}
.pb-orb-2{right:44%;top:12%;width:30px;animation-delay:-2s}
.pb-orb-3{right:6%;top:58%;width:34px;animation-delay:-4s}
.pb-copy{position:absolute;left:clamp(16px,6vw,96px);top:50%;transform:translateY(-50%);width:min(620px,52vw);display:flex;flex-direction:column;gap:22px;z-index:2}
.pb-kicker{font-family:'Anton',sans-serif;font-size:clamp(32px,3.6vw,56px);line-height:1;letter-spacing:.06em;text-transform:uppercase;margin-bottom:-10px}
.pb-names{position:relative;height:clamp(84px,9.6vw,150px);overflow:hidden}
.pb-col{position:absolute;left:0;top:0;transition:transform .55s cubic-bezier(.76,0,.24,1)}
.pb-name{height:clamp(84px,9.6vw,150px);display:flex;align-items:center;font-family:'Anton',sans-serif;font-size:clamp(78px,9vw,142px);line-height:1;text-transform:uppercase;letter-spacing:.005em;white-space:nowrap;transform:skewX(-6deg)}
.pb-col-r,.pb-col-c{opacity:0;pointer-events:none}
.pb-col-r .pb-name{color:#ffffff}
.pb-col-c .pb-name{color:#6f6f6f}
.is-g .pb-col-r{animation:pbSliceR .5s steps(1,end)}
.is-g .pb-col-c{animation:pbSliceC .5s steps(1,end)}
.pb-desc{margin:0;max-width:440px;font-size:16px;line-height:1.6;color:#D9D0CA}
.pb-cta{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 26px;border:0;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .5s,color .5s,filter .2s}
.pb-cta:hover{filter:brightness(1.15)}
.pb-stats{display:flex;gap:clamp(24px,4vw,56px);margin-top:10px}
.pb-stats div{display:flex;flex-direction:column;gap:6px}
.pb-stats b{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(24px,2.2vw,32px);line-height:1}
.pb-stats span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#A39791}
.pb-ctrl{position:absolute;right:clamp(16px,4vw,48px);bottom:84px;display:flex;align-items:center;gap:12px;z-index:3}
.pb-arrow{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(236,230,224,.35);background:rgba(7,5,5,.35);color:#ECE6E0;cursor:pointer;transition:background .3s,border-color .3s}
.pb-arrow:hover{background:rgba(236,230,224,.12);border-color:#ECE6E0}
.pb-progress{position:absolute;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:24px;display:flex;gap:10px;z-index:3}
.pb-seg{flex:1 1 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:44px;padding:0;background:none;border:0;cursor:pointer;color:#8f847f;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.pb-seg.on,.pb-seg:hover{color:#ECE6E0}
.pb-seg i{position:relative;display:block;width:100%;height:2px;background:rgba(236,230,224,.2);overflow:hidden}
.pb-seg em{position:absolute;inset:0;background:#ECE6E0;transform-origin:left;transform:scaleX(0)}
.pb-seg.on em{animation:ppFill 5.5s linear forwards}
.pb-seg.done em{transform:scaleX(1)}
@keyframes pbFlash{0%{opacity:0}18%{opacity:.55}100%{opacity:0}}
@keyframes pbCharIn{0%{opacity:0;transform:translateX(-9%);clip-path:inset(0 0 72% 0);filter:brightness(2.2) contrast(1.4)}12%{opacity:1;transform:translateX(5%);clip-path:inset(28% 0 34% 0)}24%{transform:translateX(-4%);clip-path:inset(62% 0 0 0)}36%{transform:translateX(3%);clip-path:inset(0 0 46% 0);filter:none}48%{transform:translateX(-1.5%);clip-path:inset(14% 0 8% 0)}60%{transform:none;clip-path:inset(0)}100%{opacity:1;transform:none;clip-path:inset(0)}}
@keyframes pbSliceR{0%{opacity:.9;clip-path:inset(8% 0 62% 0);transform:translateX(-14px)}20%{clip-path:inset(46% 0 22% 0);transform:translateX(12px)}40%{clip-path:inset(18% 0 54% 0);transform:translateX(-8px)}60%{clip-path:inset(70% 0 6% 0);transform:translateX(10px)}80%{clip-path:inset(0 0 84% 0);transform:translateX(-5px);opacity:.6}100%{opacity:0}}
@keyframes pbSliceC{0%{opacity:.85;clip-path:inset(60% 0 12% 0);transform:translateX(12px)}20%{clip-path:inset(4% 0 70% 0);transform:translateX(-10px)}40%{clip-path:inset(40% 0 30% 0);transform:translateX(9px)}60%{clip-path:inset(12% 0 66% 0);transform:translateX(-12px)}80%{clip-path:inset(80% 0 0 0);transform:translateX(6px);opacity:.6}100%{opacity:0}}
@keyframes pbFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes ppFill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(236,230,224,.25);background:transparent;color:var(--soft);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:16px;scroll-margin-top:24px}
.pcard .v{position:relative;aspect-ratio:4/5;overflow:hidden;background:#0d0808}
.pcard .v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.pcard .v img.fit{object-fit:contain;padding:18%;background:#050404}
.pcard:hover .v img{transform:scale(1.04)}
.pcard .badge{position:absolute;top:14px;left:14px;padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em}
.pcard h2{margin:0;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;line-height:1.5;letter-spacing:.08em;text-transform:uppercase}
.pcard .pr{display:flex;align-items:baseline;gap:10px}
.pcard .pr b{font-family:'Anton',sans-serif;font-weight:400;font-size:26px}
.pcard .pr s{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8f847f}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 40px;padding:22px 16px;border-bottom:1px solid rgba(236,230,224,.08);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){
  .pb-copy{top:auto;bottom:150px;transform:none;width:auto;right:16px}
  .pb-stage{width:100%;opacity:.55}
  .pb-stats{display:none}
  .pb-desc{font-size:14px}
  .pb-names,.pb-name{height:64px}
  .pb-name{font-size:58px}
  .pb-kicker{font-size:28px}
  .head.shop{grid-template-columns:auto 1fr auto}
  .head.shop .logo-s{justify-self:center}
}
@media (prefers-reduced-motion:reduce){.pb *{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="bar">Darmowa dostawa od 70 zł</div>
<header class="head static shop">
  <nav class="links" aria-label="Główne"><a href="index.html">Start</a><a href="sklep.html" aria-current="page">Sklep</a><a href="index.html#kontakt">Kontakt</a></nav>
  <button class="menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mnav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
  <a class="logo-s" href="index.html" aria-label="Himera, strona główna"><img src="img/logo2-white.webp" alt=""></a>
  <div class="right"><a href="https://www.instagram.com/x.himera/">IG</a><a class="cart" href="#katalog">Koszyk (<span data-cart>0</span>)</a></div>

<nav class="mnav" id="mnav" aria-label="Menu mobilne" style="position:absolute;top:120px;left:16px;right:16px;z-index:20"><a href="index.html">Start</a><a href="sklep.html">Sklep</a><a href="index.html#kontakt">Kontakt</a></nav>
<style>.mnav{display:none;padding:12px;background:rgba(10,7,7,.96);border:1px solid rgba(236,230,224,.12);flex-direction:column}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 12px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase}.mnav.open{display:flex}</style>

<section class="pb" id="pb" aria-roledescription="karuzela" aria-label="Top 3 produkty">
  <div id="pbBg"></div>
  <div class="pb-scan" aria-hidden="true"></div>
  <div class="pb-flash" id="pbFlash" aria-hidden="true"></div>
  <div class="pb-stage" aria-hidden="true">
    <div id="pbChars"></div>
    <img class="pb-orb pb-orb-1" src="img/logo2-white.webp" alt="">
    <img class="pb-orb pb-orb-2" src="img/logo2-white.webp" alt="">
    <img class="pb-orb pb-orb-3" src="img/logo2-white.webp" alt="">
  </div>
  <div class="pb-copy">
    <div class="pb-kicker">Zgarnij</div>
    <div class="pb-names" aria-live="polite">
      <div class="pb-col" data-col></div>
      <div class="pb-col pb-col-r" data-col aria-hidden="true"></div>
      <div class="pb-col pb-col-c" data-col aria-hidden="true"></div>
    </div>
    <p class="pb-desc" id="pbDesc"></p>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
      <button type="button" class="pb-cta" id="pbCta"></button>
      <span class="mono" id="pbCode" style="font-size:12px;letter-spacing:.18em;color:#CFC6C0"></span>
    </div>
    <div class="pb-stats">
      <div><b id="pbPrice"></b><span>Cena</span></div>
      <div><b id="pbOld" style="text-decoration:line-through;color:#A39791"></b><span>Było</span></div>
      <div><b id="pbThird"></b><span id="pbThirdL"></span></div>
    </div>
  </div>
  <div class="pb-ctrl">
    <span style="font-family:'Anton',sans-serif;font-size:28px;line-height:1"><span id="pbNum">01</span><span style="font-size:16px;color:#A39791"> / 03</span></span>
    <button type="button" class="pb-arrow" aria-label="Poprzedni produkt" id="pbPrev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button type="button" class="pb-arrow" aria-label="Następny produkt" id="pbNext"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="pb-progress" id="pbProg"></div>
</section>

<div class="strip"><span>Darmowa dostawa od 70 zł</span><span>−10% z newsletterem</span><span>Wysyłka w 24–48 h</span></div>

<section class="wrap" id="katalog" style="padding-top:clamp(64px,8vw,120px);padding-bottom:clamp(64px,8vw,120px)">
  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px">
    <div><div class="kicker" style="margin-bottom:18px" id="catCount"></div><h1 class="h2" style="font-size:clamp(48px,6vw,96px)">Wszystkie produkty</h1></div>
    <div role="group" aria-label="Filtr" style="display:flex;flex-wrap:wrap;gap:8px" id="chips"></div>
  </div>
  <div class="cat" id="cat"></div>
</section>

<footer class="foot"><div class="wrap">
  <div class="row" style="align-items:center">
    <img src="img/logo2-white.webp" alt="Himera" style="width:72px">
    <nav aria-label="Informacje" style="display:flex;flex-wrap:wrap;gap:14px 32px"><a href="#">Regulamin</a><a href="#">Polityka prywatności</a><a href="#">Zwroty</a><a href="#">RODO</a><a href="https://www.youtube.com/@brunowaty">YouTube</a></nav>
    <span class="mono" style="font-size:12px;letter-spacing:.12em;color:var(--muted)">© 2026 HIMERA</span>
  </div>
</div></footer>
<div class="toast" id="toast" role="status"></div>

<script src="site.js"></script>
<script>
(function () {
  var P = [
    { id: 'kominiarka', name: 'Kominiarka Himery', short: 'Kominiarka', cat: 'akcesoria', price: '139,99 zł', old: '159,99 zł', sold: true, off: '−13%', code: 'HMR-01',
      theme: '#c9c9c9', deep: '#262626', desc: 'Kominiarka z logo Himery, ta sama, którą widzisz na nagraniach. Pierwsza seria zeszła, następna jest w drodze.',
      img: 'img/char-kom.webp', imgStyle: 'right:-22%;top:-3%;width:150%', card: 'img/photo-banner.webp', cardStyle: 'object-position:74% 40%' },
    { id: 'flaga', name: 'Flaga Himery', short: 'Flaga', cat: 'akcesoria', price: '49,99 zł', old: '60,00 zł', sold: false, off: '−17%', code: 'HMR-02',
      theme: '#f4f4f4', deep: '#333333', desc: 'Tworzona po to, by się z nią obnosić. Sama flaga 60×50 cm, bez kija, tunel z lewej strony 22 mm. Trwały i lekki materiał.',
      img: 'img/char-flag.webp', imgStyle: 'right:2%;bottom:0;height:94%', card: 'img/photo-flag.webp', cardStyle: 'object-position:42% 50%' },
    { id: 'naklejka', name: 'Naklejka na samochód — logo Himery — czarna', short: 'Naklejka', cat: 'naklejki', price: '29,99 zł', old: '40,00 zł', sold: false, off: '−25%', code: 'HMR-03',
      theme: '#8c8c8c', deep: '#161616', desc: 'Stań się częścią Himery. Logo na auto, w czerni albo bieli, do przyklejenia w kilka minut.',
      img: 'img/logo2-white.webp', imgStyle: 'right:12%;top:18%;width:64%;filter:drop-shadow(0 0 24px rgba(255,255,255,.55)) drop-shadow(0 0 80px rgba(255,255,255,.25))', card: 'img/photo-cap.webp', cardStyle: '' },
    { id: 'naklejka-biala', name: 'Naklejka na samochód — logo Himery — biała', cat: 'naklejki', price: '29,99 zł', old: '40,00 zł', sold: true, off: '−25%', card: 'img/logo2-white.webp', fit: true },
    { id: 'napis', name: 'Naklejka na samochód — napis Himera — biała', cat: 'naklejki', price: '29,99 zł', old: '40,00 zł', sold: false, off: '−25%', card: 'img/wordmark-white.webp', fit: true }
  ];
  var TOP = P.slice(0, 3), idx = 0, timer = 0, gt = 0, filter = 'all';
  var $ = function (id) { return document.getElementById(id); };
  var pb = $('pb');
  $('pbBg').innerHTML = TOP.map(function (p, i) { return '<div class="pb-bg" style="opacity:' + (i ? 0 : 1) + ';background:radial-gradient(55% 70% at 72% 50%,' + p.theme + ' 0%,' + p.deep + ' 42%,#060606 85%)"></div>'; }).join('');
  $('pbChars').innerHTML = TOP.map(function (p, i) { return '<div class="pb-char' + (i ? '' : ' on') + '"><div class="pb-blob" style="right:18%;top:24%;width:46%;aspect-ratio:1;background:' + p.theme + '"></div><img src="' + p.img + '" alt="" style="' + p.imgStyle + '"></div>'; }).join('');
  document.querySelectorAll('[data-col]').forEach(function (c) { c.innerHTML = TOP.map(function (p) { return '<div class="pb-name">' + p.short + '</div>'; }).join(''); });
  $('pbProg').innerHTML = TOP.map(function (p, i) { return '<button type="button" class="pb-seg" aria-label="' + p.short + '" data-i="' + i + '"><span>' + p.short + '</span><i><em></em></i></button>'; }).join('');
  function paint() {
    var a = TOP[idx];
    pb.querySelectorAll('.pb-bg').forEach(function (el, i) { el.style.opacity = i === idx ? 1 : 0; });
    pb.querySelectorAll('.pb-char').forEach(function (el, i) { el.classList.toggle('on', i === idx); });
    pb.querySelectorAll('[data-col]').forEach(function (c) { c.style.transform = 'translateY(' + (-idx * 100 / 3) + '%)'; });
    pb.querySelectorAll('.pb-seg').forEach(function (el, i) {
      el.classList.remove('on'); el.classList.toggle('done', i < idx); el.setAttribute('aria-pressed', i === idx);
      if (i === idx) { void el.offsetWidth; el.classList.add('on'); }
    });
    $('pbFlash').style.background = 'radial-gradient(60% 60% at 60% 50%,' + a.theme + ',rgba(0,0,0,0) 70%)';
    pb.querySelectorAll('.pb-orb').forEach(function (o) { o.style.filter = 'drop-shadow(0 0 10px ' + a.theme + ') drop-shadow(0 0 22px ' + a.theme + ')'; });
    $('pbDesc').textContent = a.desc; $('pbCode').textContent = a.code; $('pbNum').textContent = '0' + (idx + 1);
    $('pbPrice').textContent = a.price; $('pbOld').textContent = a.old;
    $('pbThird').textContent = a.sold ? 'Wyprzedane' : a.off; $('pbThird').style.color = a.theme; $('pbThirdL').textContent = a.sold ? 'Status' : 'Rabat';
    var cta = $('pbCta');
    cta.innerHTML = (a.sold ? 'Powiadom o dostępności' : 'Dodaj do koszyka') + ' <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    cta.style.background = a.theme; cta.style.color = '#070505';
  }
  function show(i) {
    var n = (i + 3) % 3; if (n === idx) return;
    idx = n; clearTimeout(gt); pb.classList.remove('is-g'); paint();
    requestAnimationFrame(function () { pb.classList.add('is-g'); gt = setTimeout(function () { pb.classList.remove('is-g'); }, 600); });
  }
  function restart() { clearInterval(timer); timer = setInterval(function () { show(idx + 1); }, 5500); }
  function go(i) { show(i); restart(); }
  $('pbPrev').onclick = function () { go(idx - 1); };
  $('pbNext').onclick = function () { go(idx + 1); };
  $('pbProg').onclick = function (e) { var b = e.target.closest('.pb-seg'); if (b) go(+b.dataset.i); };
  $('pbCta').onclick = function () { add(TOP[idx]); };
  function add(p) { if (p.sold) { toast('Damy znać, gdy wróci: ' + p.name); return; } cartAdd(p.id); toast('Dodano do koszyka: ' + p.name); }
  var touchX = null;
  pb.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  pb.addEventListener('touchend', function (e) { if (touchX === null) return; var dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); touchX = null; });
  paint(); restart();

  var cats = [['all', 'Wszystko'], ['akcesoria', 'Akcesoria'], ['naklejki', 'Naklejki']];
  function renderCat() {
    var vis = P.filter(function (p) { return filter === 'all' || p.cat === filter; });
    $('catCount').textContent = 'Katalog — ' + vis.length + ' produktów';
    $('chips').innerHTML = cats.map(function (c) { return '<button type="button" class="chip' + (filter === c[0] ? ' on' : '') + '" aria-pressed="' + (filter === c[0]) + '" data-f="' + c[0] + '">' + c[1] + '</button>'; }).join('');
    $('cat').innerHTML = vis.map(function (p) {
      return '<article class="pcard" id="' + p.id + '"><div class="v"><img ' + (p.fit ? 'class="fit" ' : '') + 'src="' + p.card + '" alt="' + p.name + '" style="' + (p.cardStyle || '') + '" loading="lazy">' +
        '<span class="badge" style="' + (p.sold ? 'background:#ECE6E0;color:#070505' : 'background:#C4161C;color:#fff') + '">' + (p.sold ? 'WYPRZEDANE' : p.off) + '</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:8px"><h2>' + p.name + '</h2><div class="pr"><b>' + p.price + '</b><s>' + p.old + '</s></div></div>' +
        '<button type="button" class="btn ' + (p.sold ? 'btn-line' : 'btn-red') + '" data-add="' + p.id + '" style="width:100%">' + (p.sold ? 'Powiadom o dostępności' : 'Dodaj do koszyka') + '</button></article>';
    }).join('');
  }
  $('chips').onclick = function (e) { var b = e.target.closest('.chip'); if (b) { filter = b.dataset.f; renderCat(); } };
  $('cat').onclick = function (e) { var b = e.target.closest('[data-add]'); if (b) add(P.filter(function (p) { return p.id === b.dataset.add; })[0]); };
  renderCat();
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(function () { t.scrollIntoView({ behavior: 'smooth' }); }, 300); }
})();
</script>
